# Serves the Astro static build (dist/) — see Dockerfile (T2-10).
# No SPA fallback: Astro emits a real HTML file per route.
# Runs as the unprivileged nginx user (uid 101); still listens on 80 so the
# root compose mapping 3000:80 is unchanged (see Dockerfile for how).
server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Don't advertise the nginx version in headers or error pages.
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  # gzip text assets (images/fonts are already compressed formats).
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;

  # Never serve dotfiles or Pages control files (_headers, _redirects, _routes.json, _worker.js).
  location ~ (^|/)\. {
    return 404;
  }
  location ~ ^/(_headers|_redirects|_routes\.json|_worker\.js) {
    return 404;
  }

  # Astro content-hashes everything under /_astro/ — cache forever.
  location /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Astro emits clean-URL directories (/about/index.html). Try the exact file,
  # then the directory, then the .html variant, before falling back to 404.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
