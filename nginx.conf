# Serves the Astro static build (dist/) — see Dockerfile (T2-10).
# No SPA fallback: Astro emits a real HTML file per route.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # gzip text assets (images/fonts are already compressed formats).
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;

  # Astro content-hashes everything under /_astro/ — cache forever.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Astro emits clean-URL directories (/about/index.html). Try the exact file,
  # then the directory, then the .html variant, before falling back to 404.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
